services:
  controller:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DOMAIN: https://docker.example.com
      TRUST_PROXY: direct
      # Time zone for backup schedules, job output and log times
      TZ: Europe/Ljubljana
    volumes:
      - data:/data

volumes:
  data:
